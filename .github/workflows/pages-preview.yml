name: Deploy static site preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview-nekurama-architecture
  cancel-in-progress: false

jobs:
  deploy:
    # This preview is intentionally controlled by the role branch only.
    if: github.ref == 'refs/heads/nekurama/architecture'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out the committed role-branch source
        uses: actions/checkout@v4
        with:
          ref: nekurama/architecture

      - name: Verify Pages artifact boundary
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s\n' site/app.js site/favicon.svg site/index.html site/styles.css)"
          actual="$(git ls-files site | sort)"
          test "$actual" = "$expected"
          test -f site/index.html
          test -f site/styles.css
          test -f site/app.js
          test -f site/favicon.svg
          ! grep -RInE '(^|[^:])https?://|fetch\(|XMLHttpRequest|WebSocket|localStorage|sessionStorage|document\.cookie' site \
            --exclude='favicon.svg'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload only the site directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
