name: Deploy static site preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview-babai-feature
  cancel-in-progress: false

jobs:
  deploy:
    # Manager integration target: do not run this workflow from a role branch.
    if: github.ref == 'refs/heads/nekurama/babai-feature'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out the committed feature source
        uses: actions/checkout@v4
        with:
          ref: nekurama/babai-feature

      - name: Verify Pages artifact boundary
        shell: bash
        run: |
          set -euo pipefail
          printf 'Source ref: %s\nSource revision: %s\n' \
            'nekurama/babai-feature' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          expected="$(printf '%s\n' site/app.js site/favicon.svg site/index.html site/styles.css)"
          actual="$(git ls-files site | sort)"
          test "$actual" = "$expected"
          test -f site/index.html
          test -f site/styles.css
          test -f site/app.js
          test -f site/favicon.svg
          ! grep -RInE '(^|[^:])https?://|fetch\(|XMLHttpRequest|WebSocket|localStorage|sessionStorage|document\.cookie|Authorization:|Bearer [A-Za-z0-9._-]{12,}|gh[pousr]_[A-Za-z0-9]{20,}|-----BEGIN .* PRIVATE KEY-----' site \
            --exclude='favicon.svg'
          ! grep -RInE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}|\+?[0-9][0-9 ()-]{7,}' site \
            --exclude='favicon.svg'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload only the site directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
